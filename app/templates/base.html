<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sundo Kuno{% endblock %}</title>

    <!-- Ikon & Font (Inter, Spectral untuk judul, Noto Sans Sundanese untuk aksara) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Sundanese&family=Spectral:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Blok untuk CSS tambahan khusus per halaman -->
    {% block extra_css %}{% endblock %}

    <!-- 1. SKRIP PENCEGAH BERKEDIP (Wajib di head agar tema langsung aktif sebelum HTML muncul) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><span>Sundo Kuno</span></h2>
                <!-- Tombol toggle tema gelap & collapse sidebar -->
                <div class="header-buttons">
                    <button id="theme-toggle" class="toggle-btn" title="Ubah Tema">🌙</button>
                    <button id="toggle-btn" class="toggle-btn" title="Sembunyikan Menu">☰</button>
                </div>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}"><i class="bi bi-search"></i> <span>Beranda</span></a></li>
                    <li><a href="{{ url_for('main.kamus') }}" class="{{ 'active' if request.endpoint == 'main.kamus' }}"><i class="bi bi-journal-bookmark-fill"></i> <span>Indeks Kamus</span></a></li>
                    <li><a href="{{ url_for('main.sparql_endpoint') }}" class="{{ 'active' if request.endpoint == 'main.sparql_endpoint' }}"><i class="bi bi-terminal"></i> <span>SPARQL Console</span></a></li>
                    <li><a href="{{ url_for('main.evaluasi_uat') }}" class="{{ 'active' if request.endpoint == 'main.evaluasi_uat' }}"><i class="bi bi-check-circle"></i> <span>Evaluasi &amp; UAT</span></a></li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                <span>Korpus Semantik Naskah Sunda Kuno · RDF/OWL · SPARQL</span>
            </div>
        </aside>

        <main class="main-content">
            {% block content %}
            {% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    
    <!-- 3. LOGIKA JAVASCRIPT UNTUK KLIK TOMBOL -->
    <script>
        const themeToggle = document.getElementById('theme-toggle');
        
        // Sesuaikan ikon tombol saat pertama kali dimuat
        const updateToggleIcon = (theme) => {
            themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
        };
        updateToggleIcon(document.documentElement.getAttribute('data-theme'));

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateToggleIcon(newTheme);
        });
    </script>
    
    <!-- Blok untuk JS tambahan khusus per halaman -->
    {% block extra_js %}{% endblock %}
</body>
</html>
